name: Windows validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm test
      - run: npm run validate:schema
      - run: cargo test --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: npm run desktop:build
      - run: npm run build:extension
      - name: Checksum Windows test packages
        shell: pwsh
        run: |
          foreach ($folder in @('target/release/bundle/nsis', 'target/extension')) {
            $files = Get-ChildItem $folder -File | Where-Object { $_.Extension -in '.exe', '.zip' }
            $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
            Set-Content -Path "$folder/SHA256SUMS.txt" -Value $lines -Encoding ascii
          }
      - name: Upload unsigned Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: uzjam-windows-test-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Chrome companion test package
        uses: actions/upload-artifact@v4
        with:
          name: uzjam-chrome-test-${{ github.sha }}
          path: |
            target/extension/*.zip
            target/extension/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
