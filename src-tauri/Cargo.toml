[package]
name = "uzjam-desktop"
version = "0.6.0"
description = "UZjam Windows desktop host"
edition.workspace = true
license.workspace = true

[lib]
name = "uzjam_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uzjam"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tungstenite = "0.28"
getrandom = "0.3"
uzjam-audio = { path = "../crates/uzjam-audio" }
uzjam-core = { path = "../crates/uzjam-core" }
uzjam-dsp = { path = "../crates/uzjam-dsp" }

[target.'cfg(windows)'.dependencies]
uzjam-apo-ffi = { path = "../crates/uzjam-apo-ffi" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile = "3"
